name: CI — Build, Test & Publish

# Trigger on every push and pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Needed so the workflow can write packages to GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  # ghcr.io/<owner>/<repo> — all lowercase, GitHub resolves the owner automatically
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/task-manager

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — compile & test
  # Runs on every push and PR. The docker job only proceeds if this passes.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Run Tests (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & test with Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — build Docker image & push to GHCR
  # Only runs on pushes to main (not on PRs — we don't publish unreviewed code)
  # Depends on build-and-test passing first.
  # ─────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test                          # waits for tests to pass
    if: github.event_name == 'push'                # skip on pull requests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Enables multi-platform builds (linux/amd64 + linux/arm64) and
      # advanced cache features via BuildKit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry using the automatic GITHUB_TOKEN
      # — no manual secret needed, GitHub provides this token for free
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags and labels from Git metadata:
      #   - :latest          always points to the most recent main build
      #   - :main            branch name
      #   - :sha-<short>     exact commit SHA for traceability
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # Build the image using the multi-stage Dockerfile and push all tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in the GitHub Actions cache to speed up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print a summary of what was pushed so it's visible in the Actions log
      - name: Image summary
        run: |
          echo "### Docker image published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ghcr.io" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
