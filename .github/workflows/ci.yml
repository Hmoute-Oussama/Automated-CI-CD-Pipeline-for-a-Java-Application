name: CI — Build & Test

# Trigger on every push and pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    # Test against two LTS Java versions
    strategy:
      matrix:
        java: [ 17, 21 ]

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up the requested JDK version
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven          # caches ~/.m2 between runs — speeds up builds

      # 3. Build the project and run all tests
      - name: Build & test with Maven
        run: mvn --batch-mode --no-transfer-progress verify

      # 4. Upload the Surefire test report as a downloadable artifact
      - name: Upload test report
        if: always()            # upload even when tests fail so you can inspect
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report-java-${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 7
