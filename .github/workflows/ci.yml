name: CI — Build & Test

# Trigger on every push and pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Run Tests (Java 21)
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven          # caches ~/.m2 between runs — speeds up builds

      # 3. Build the project and run all tests
      - name: Build & test with Maven
        run: mvn --batch-mode --no-transfer-progress verify

      # 4. Upload the Surefire test report as a downloadable artifact
      - name: Upload test report
        if: always()            # upload even when tests fail so you can inspect
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report-java-21
          path: target/surefire-reports/
          retention-days: 7
